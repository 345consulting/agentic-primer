[project]
name            = "agentic-primer"
version         = "0.1.0"
description     = "The mechanics of an agentic harness, one chapter at a time."
requires-python = ">=3.14"
dependencies    = [
    "langchain-core>=1.6,<2",
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2,<2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.mypy]
files                  = ["src", "tests"]
mypy_path              = "src"
explicit_package_bases = true
python_version = "3.14"
strict         = true

# Two checkers, because they disagree usefully. mypy is the gate the project
# was written against; basedpyright caught an import cycle, a deprecated
# `@contextmanager` return type, and three unmarked overrides that mypy passes
# in silence. The categories below are off for one reason each -- not because
# they are noisy, but because they are answered by a design decision this
# project has already made.
[tool.basedpyright]
include       = ["src", "tests"]
extraPaths    = ["src"]
pythonVersion = "3.14"

# A trace is JSON, and JSON is Any until something narrows it. `view` reads it
# back off disk, so every field access is Any by construction. Silencing these
# would take a typed schema for the trace -- a real design decision, not a lint
# setting, and one that would put the shape of the record in two places.
reportAny                 = false
reportExplicitAny         = false
reportUnknownArgumentType = false
reportUnknownMemberType   = false
reportUnknownVariableType = false

# Tests import `_request_headers` and `_response_headers` deliberately: the
# rule they enforce is that no credential reaches a file on disk, and testing
# it through the public surface would test the caller instead.
reportPrivateUsage = false

# Adjacent string literals are how a 100-character line holds a sentence.
reportImplicitStringConcatenation = false

# `out: Path = Path("out")` is the default output directory, evaluated once at
# import and never mutated.
reportCallInDefaultInitializer = false

# A test that calls something for its effect is asserting that it did not
# raise. Binding the result to `_` says less than the test name already does.
reportUnusedCallResult = false

# `langgraph` ships `py.typed` at the package root, but basedpyright still
# flags specific submodules (`langgraph.graph`, `langgraph.graph.message`)
# as stub-less -- a real quirk of the package, not something a chapter can
# fix, and one every chapter from `ch32_graph` onward would otherwise hit.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts    = "-v"
pythonpath = ["src"]
testpaths  = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "N", "PTH", "RET", "RUF", "SIM", "UP", "W"]

# House rule, documented deviation from the ecosystem default: project modules
# first, standard library second, third-party third. See code-style.md.
[tool.ruff.lint.isort]
known-first-party = ["chapters", "order", "support"]
section-order     = ["future", "first-party", "local-folder", "standard-library", "third-party"]

# BaseChatModel fixes the signature of _generate; `stop`, `run_manager` and
# `**kwargs` must be accepted whether or not the scripted model uses them.
[tool.ruff.lint.per-file-ignores]
"src/support/models.py" = ["ARG002"]

# CallbackManagerMixin fixes on_chat_model_start's exact signature; matching
# it is the point of ch39's Meddler scenario -- a callback handler's real
# interface is what any application would have to implement, and most of
# its parameters go unused here on purpose.
"src/chapters/ch39_callbacks.py" = ["ARG002"]

# mypy's overload resolution for StateGraph.add_node fails whenever a node
# function's parameter is named with a leading underscore -- a real mypy
# quirk with this specific generic API, confirmed against basedpyright
# (which accepts either name) and against every other chapter's node
# functions (none of which happen to have an unused state parameter). The
# node functions here are unused by design -- several scenarios are the
# reducer alone, no state read -- so ARG001 is the one honest exception.
"src/chapters/ch38_reducers.py" = ["ARG001"]
